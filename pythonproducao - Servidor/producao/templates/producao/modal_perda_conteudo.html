<ul class="nav nav-tabs" id="perdaTab" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-dados">Dados</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-fotos">Fotos</button></li>
</ul>

<div class="tab-content mt-3" id="perdaTabContent">
    <div class="tab-pane fade show active" id="tab-dados">
        <form id="form-edicao-dados" action="{% url 'atualizar_perda_ajax' registro.id %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Quantidade de Peças</label>
                <input type="number" name="quantidade" class="form-control" value="{{ registro.quantidade }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Resolução do Problema</label>
                <textarea name="resolucao" class="form-control" rows="4">{{ registro.resolucao|default:'' }}</textarea>
            </div>
            <div class="mb-3">
                <label for="id_motivo" class="form-label">Motivo</label>
                <textarea class="form-control" name="motivo" id="id_motivo" rows="2">{{ registro.motivo|default:'' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
        </form>
    </div>

<div class="tab-pane fade" id="tab-fotos">
    <div id="corpo-modal-fotos" class="p-3">
        <div class="row">
            {% for foto in fotos %}
            <div class="col-md-4 mb-3">
                <a href="{% url 'servir_foto_peca_matada' foto.id %}" 
                    class="glightbox" 
                    data-gallery="gallery-perda" 
                    data-type="image"> 
                        
                    <img src="{% url 'servir_foto_peca_matada' foto.id %}" 
                        class="img-thumbnail" 
                        style="height: 100px; width: 100%; object-fit: cover;">
                </a>
            </div>
            {% empty %}
            <p class="text-muted text-center">Nenhuma foto anexada.</p>
            {% endfor %}
        </div>
        <hr>
        <form id="form-upload-foto" action="{% url 'fotos_peca_matada_modal' registro.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Selecionar nova foto:</label>
                <input type="file" name="foto_upload" class="form-control" required accept="image/*">
            </div>
            <button type="submit" class="btn btn-secondary w-100">Adicionar Foto</button>
        </form>
    </div>
</div>
